# CI cho phiên bản triển khai thực tế
name: Test Product CI - Production

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ---------- JOB 1: Test CRUD với MongoDB service ----------
  crud-test:
    name: CRUD test with MongoDB
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:8.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping:1}).ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      URL_MONGO: mongodb://localhost:27017/
      DATABASE_NAME: productdb
      DATABASE_NAME_TEST: productdb_test

    steps:
      - name: 1. Checkout source code
        uses: actions/checkout@v5

      - name: 2. Setup Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: 3. Install dependencies
        run: npm ci

      - name: 4. Check MongoDB service
        run: docker ps

      - name: 5. Run simple tests
        run: npm test

      - name: 6. Run CRUD tests with MongoDB
        run: npm run test:crud

  # ---------- JOB 2: Test production bằng Docker Compose ----------
  e2e-docker:
    name: E2E test on Docker Compose
    runs-on: ubuntu-latest
    needs: crud-test

    steps:
      - name: 1. Checkout source code
        uses: actions/checkout@v5

      - name: 2. Setup Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: 3. Install dependencies
        run: npm ci

      - name: 4. Create .env from .env.example
        run: cp .env.example .env

      - name: 5. Build and start stack
        run: docker compose up -d --build --wait

      - name: 6. Show healthy containers
        run: docker compose ps

      - name: 7. Smoke test CRUD
        run: npm run test:smoke

      - name: 8. Show Product API logs
        if: always()
        run: docker logs product-api

      - name: 9. Stop stack
        if: always()
        run: docker compose down -v