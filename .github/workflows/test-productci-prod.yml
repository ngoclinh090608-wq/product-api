# CI cho phiên bản triển khai thực tế: test CRUD với MongoDB thật trên máy ảo GitHub
name: Test Product CI - Production

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  # ---------- JOB 1: Test CRUD với MongoDB service ----------
  crud-test:
    name: CRUD test with MongoDB
    runs-on: ubuntu-latest

    # Chạy MongoDB như một "service container" bên cạnh máy ảo
    services:
      mongodb:
        image: mongo:8.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping:1}).ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    # Biến môi trường thay cho file .env (máy ảo không có .env)
    env:
      URL_MONGO: mongodb://localhost:27017/
      DATABASE_NAME: productdb
      DATABASE_NAME_TEST: productdb_test

    steps:
      - name: 1. Checkout source code
        uses: actions/checkout@v5

      - name: 2. Setup Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: 3. Install dependencies
        run: npm ci

      - name: 4. Check MongoDB service
        run: docker ps

      - name: 5. Run simple tests (no database)
        run: npm test

      - name: 6. Run CRUD tests with MongoDB
        run: npm run test:crud

  # ---------- JOB 2: Chạy như production bằng Docker Compose ----------
  e2e-docker:
    name: E2E test on Docker Compose (healthcheck + CRUD)
    runs-on: ubuntu-latest
    needs: crud-test          # chỉ chạy khi JOB 1 thành công

    steps:
      - name: 1. Checkout source code
        uses: actions/checkout@v5

      - name: 2. Setup Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: 3. Create .env from .env.example
        run: cp .env.example .env

      - name: 4. Build and start stack (wait until healthy)
        run: docker compose up -d --build --wait

      - name: 5. Show containers (must be healthy)
        run: docker ps

      - name: 6. Smoke test CRUD on running container
        run: npm run test:smoke

      - name: 7. Show product-api logs
        if: always()
        run: docker logs product-api

      - name: 8. Stop stack
        if: always()
        run: docker compose down -v