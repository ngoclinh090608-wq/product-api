# CI/CD cho phiên bản triển khai thực tế
name: Test Product CI - Production

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  # ---------- JOB 1: Test CRUD với MongoDB service ----------
  crud-test:
    name: CRUD test with MongoDB
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:8.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping:1}).ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      URL_MONGO: mongodb://localhost:27017/
      DATABASE_NAME: productdb
      DATABASE_NAME_TEST: productdb_test

    steps:
      - name: 1. Checkout source code
        uses: actions/checkout@v5

      - name: 2. Setup Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: 3. Install dependencies
        run: npm ci

      - name: 4. Check MongoDB service
        run: docker ps

      - name: 5. Run simple tests (no database)
        run: npm test

      - name: 6. Run CRUD tests with MongoDB
        run: npm run test:crud

  # ---------- JOB 2: Chạy như production bằng Docker Compose ----------
  e2e-docker:
    name: E2E test on Docker Compose (healthcheck + CRUD)
    runs-on: ubuntu-latest
    needs: crud-test

    steps:
      - name: 1. Checkout source code
        uses: actions/checkout@v5

      - name: 2. Setup Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: 3. Create .env from .env.example
        run: cp .env.example .env

      - name: 4. Build and start stack (wait until healthy)
        run: docker compose up -d --build --wait

      - name: 5. Show containers (must be healthy)
        run: docker ps

      - name: 6. Smoke test CRUD on running container
        run: npm run test:smoke

      - name: 7. Show product-api logs
        if: always()
        run: docker logs product-api

      - name: 8. Stop stack
        if: always()
        run: docker compose down -v

  # ---------- JOB 3: CD - Healthcheck rồi push lên Docker Hub ----------
  cd-dockerhub:
    name: CD - Healthcheck & push image to Docker Hub
    runs-on: ubuntu-latest
    needs: [crud-test, e2e-docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    env:
      IMAGE_NAME: ngoclinh0908/product-api

    steps:
      - name: 1. Checkout source code
        uses: actions/checkout@v5

      - name: 2. Build Docker image (2 tags - latest và mã commit)
        run: |
          SHORT_SHA=${GITHUB_SHA::7}
          echo "SHORT_SHA=$SHORT_SHA" >> $GITHUB_ENV
          docker build -t $IMAGE_NAME:latest -t $IMAGE_NAME:$SHORT_SHA .
          docker images $IMAGE_NAME

      - name: 3. Healthcheck image trước khi push
        run: |
          docker network create ci-net
          docker run -d --name ci-mongo --network ci-net mongo:8.0
          docker run -d --name ci-api --network ci-net -p 3000:3000 \
            --restart on-failure \
            -e URL_MONGO=mongodb://ci-mongo:27017/ \
            -e DATABASE_NAME=productdb \
            $IMAGE_NAME:latest
          for i in $(seq 1 20); do
            STATUS=$(docker inspect --format '{{.State.Health.Status}}' ci-api)
            echo "Lần $i: ci-api is $STATUS"
            if [ "$STATUS" = "healthy" ]; then break; fi
            sleep 3
          done
          docker ps
          if [ "$STATUS" != "healthy" ]; then
            echo "❌ Image KHÔNG healthy -> dừng, không push lên Docker Hub"
            docker logs ci-api
            exit 1
          fi
          curl -f http://localhost:3000/health
          echo ""
          echo "✅ Image healthy -> được phép push"

      - name: 4. Login Docker Hub
        run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      - name: 5. Push image lên Docker Hub
        run: |
          docker push $IMAGE_NAME:latest
          docker push $IMAGE_NAME:$SHORT_SHA

      - name: 6. Clean up
        if: always()
        run: |
          docker rm -f ci-api ci-mongo || true
          docker network rm ci-net || true
          docker logout || true