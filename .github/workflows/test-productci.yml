# CI đơn giản: chạy tự động mỗi khi push lên nhánh main
name: Test Product CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:        # cho phép bấm chạy tay trên tab Actions

jobs:
  test:
    name: Simple CI test
    runs-on: ubuntu-latest   # máy ảo Ubuntu do GitHub cung cấp

    steps:
      - name: 1. Checkout source code
        uses: actions/checkout@v5

      - name: 2. Setup Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: 3. Show versions
        run: |
          node -v
          npm -v
          docker --version

      - name: 4. Install dependencies
        run: npm ci

      - name: 5. Check syntax
        run: |
          for f in app.js models/*.js controllers/*.js routes/*.js; do
            node --check "$f" && echo "OK: $f"
          done

      - name: 6. Run tests
        run: npm test

      - name: 7. Build Docker image (test only)
        run: docker build -t product-api:ci .