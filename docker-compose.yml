name: product-compose

services:
  # ---------- MongoDB ----------
  mongodb:
    image: mongo:8.0
    container_name: nammongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - product-network
    # 🆕 Healthcheck MongoDB: ping database mỗi 10 giây
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ---------- Product API ----------
  product-api:
    build: .
    image: product-api:latest
    container_name: product-api
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      # Ghi đè .env: trong Compose, API gọi MongoDB bằng TÊN SERVICE "mongodb"
      URL_MONGO: mongodb://mongodb:27017/
      NODE_ENV: production
    # 🆕 Chỉ khởi động API khi MongoDB đã healthy
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - product-network
    # 🆕 Healthcheck API: gọi /health mỗi 10 giây
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  mongo_data:
    name: nammongodb_data   # dùng lại volume dữ liệu từ Bước 5

networks:
  product-network:
    name: product-network