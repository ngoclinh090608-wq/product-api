# Tên project Compose (thay cho tên thư mục)
name: product-compose

services:
  # ---------- MongoDB ----------
  mongodb:
    image: mongo:8.0
    container_name: nammongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - product-network

  # ---------- Product API ----------
  product-api:
    build: .
    image: product-api:latest
    container_name: product-api
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      # Ghi đè .env: trong Compose, API gọi MongoDB bằng TÊN SERVICE "mongodb"
      URL_MONGO: mongodb://mongodb:27017/
      NODE_ENV: production
    depends_on:
      - mongodb
    networks:
      - product-network

volumes:
  mongo_data:
    name: nammongodb_data   # dùng lại volume dữ liệu từ Bước 5

networks:
  product-network:
    name: product-network